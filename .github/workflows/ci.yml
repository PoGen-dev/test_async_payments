name: Payment processor CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and tooling
        run: python -m pip install -e '.[test]'
      - name: Static checks
        run: |
          python -m compileall -q app alembic tests
          ruff check --select E4,E7,E9 app tests
      - name: Unit tests
        env:
          API_KEY: unit-ci-key
          WEBHOOK_SIGNING_SECRET: unit-ci-webhook-signature
        run: python -m pytest -q -m 'not integration'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import secrets
          values = {
              'API_KEY': secrets.token_urlsafe(32),
              'WEBHOOK_SIGNING_SECRET': secrets.token_urlsafe(32),
              'POSTGRES_PASSWORD': secrets.token_urlsafe(20),
              'RABBITMQ_PASSWORD': secrets.token_urlsafe(20),
          }
          Path('.env').write_text('\n'.join(f'{key}={value}' for key, value in values.items()) + '\n')
          PY
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Start integration services
        run: docker compose up -d --build postgres rabbitmq migrate
      - name: Run complete integration and coverage suite
        run: docker compose --profile test run --build --rm tests
      - name: Docker health and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=200 postgres rabbitmq migrate
      - name: Shutdown disposable services
        if: always()
        run: docker compose down -v --remove-orphans
